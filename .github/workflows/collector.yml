name: Hourly Data Collector

on:
  schedule:
    # Runs every hour at minute 0 (UTC) — adjust for IST: IST = UTC+5:30
    # To run at every hour IST, offset by 5.5 hours:
    # 06:00 IST = 00:30 UTC, 07:00 IST = 01:30 UTC, etc.
    - cron: '30 * * * *'
  workflow_dispatch:  # Also allows manual trigger from GitHub Actions UI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data collector
        env:
          NEON_DATABASE_URL:    ${{ secrets.NEON }}
          SOLIS_API_KEY:        ${{ secrets.SOLIS_API }}
          SOLIS_API_SECRET:     ${{ secrets.SOLIS_SECRET }}
          SOLIS_BASE_URL:       ${{ secrets.SOLIS_URL }}
          GROWATT_USERNAME:     ${{ secrets.GROWATT_USERNAME }}
          GROWATT_PASSWORD:     ${{ secrets.GROWATT_PASSWORD }}
          RATE_PER_KWH:         ${{ secrets.RATE_PER_KWH }}
        run: python collector.py
