name: Keep App Alive

on:
  schedule:
    - cron: "*/20 * * * *"   # ping every 20 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STREAMLIT_URL }}")
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: app returned $STATUS"
          fi
